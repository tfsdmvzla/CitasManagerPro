<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h3 { margin-top: 0; margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; opacity: 0.8; }
    input, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    input:disabled {
      background-color: var(--tg-theme-secondary-bg-color, #e9ecef);
      color: var(--tg-theme-hint-color, #6c757d);
      cursor: not-allowed;
    }
    button {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h3>Registro de usuario</h3>
  <form id="registroForm">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Ingresa tu nombre" required />

    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" placeholder="Ingresa tu apellido" required />

    <label for="estatus">Estatus</label>
    <input type="text" id="estatus" value="Pendiente" disabled />

    <button type="submit">Registrarme</button>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.getElementById("registroForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const datos = {
        nombre: document.getElementById("nombre").value.trim(),
        apellido: document.getElementById("apellido").value.trim(),
        estatus: document.getElementById("estatus").value
      };

      tg.sendData(JSON.stringify(datos));
    });
  </script>
</body>
</html>
